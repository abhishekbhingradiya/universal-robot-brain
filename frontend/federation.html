<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>URB - Federation</title>

    [TW]

    [CSS]

</head>

<body class="bg-slate-950 text-white">

    <div class="flex flex-col md:flex-row min-h-screen">

        <main class="flex-1 overflow-auto">

            <header
                class="border-b border-slate-800 p-6"
            >

                <h2
                    class="text-3xl font-bold"
                >
                    Federation Registry
                </h2>

                <p
                    class="text-slate-400 mt-2"
                >
                    Manage federation nodes
                </p>

            </header>

            <div class="p-6 space-y-6">

                <div class="card">

                    <h3
                        class="text-lg font-semibold mb-4"
                    >
                        Create Node
                    </h3>

                    <div
                        class="grid grid-cols-2 gap-4"
                    >

                        <input
                            id="node-id"
                            class="input"
                            placeholder="germany-west"
                        >

                        <input
                            id="region"
                            class="input"
                            placeholder="Germany"
                        >

                    </div>

                    <button
                        onclick="createNode()"
                        class="btn-primary mt-4"
                    >
                        Create Node
                    </button>

                </div>

                <div class="card">

                    <h3
                        class="text-xl font-semibold mb-4"
                    >
                        Federation Nodes
                    </h3>

                    <table class="w-full">

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Node</th>

                                <th>Region</th>

                                <th>Status</th>

                            </tr>

                        </thead>

                        <tbody
                            id="nodes-body"
                        >
                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    [API]

    js/federation.jsscript>

</body>

</html>
